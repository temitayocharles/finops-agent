<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">FinOps Agent Architecture</title>
  <desc id="desc">Architecture showing evidence sources feeding the FinOps Agent core, delivery integrations, operator approval, infrastructure changes, and post-change validation.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L12,6 L0,12 z" fill="#64748b"/>
    </marker>
    <linearGradient id="coreGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ec"/>
      <stop offset="100%" stop-color="#fffdf7"/>
    </linearGradient>
    <style>
      .bg { fill:#f8fafc; }
      .group { fill:#ffffff; stroke:#cbd5e1; stroke-width:1.5; rx:22; filter:url(#shadow); }
      .group-core { fill:url(#coreGrad); stroke:#f59e0b; stroke-width:2; rx:24; filter:url(#shadow); }
      .group-title { font:700 18px Inter, ui-sans-serif, system-ui, sans-serif; fill:#0f172a; }
      .group-sub { font:500 12px Inter, ui-sans-serif, system-ui, sans-serif; fill:#64748b; }
      .node { fill:#fff; stroke:#d7dee8; stroke-width:1.4; rx:15; }
      .node-blue { fill:#eff6ff; stroke:#60a5fa; }
      .node-amber { fill:#fff7ed; stroke:#fb923c; }
      .node-green { fill:#f0fdf4; stroke:#4ade80; }
      .node-purple { fill:#f5f3ff; stroke:#a78bfa; }
      .node-title { font:700 15px Inter, ui-sans-serif, system-ui, sans-serif; fill:#0f172a; }
      .node-sub { font:500 11px Inter, ui-sans-serif, system-ui, sans-serif; fill:#64748b; }
      .edge { fill:none; stroke:#64748b; stroke-width:2; marker-end:url(#arrow); }
      .edge-dash { fill:none; stroke:#64748b; stroke-width:2; stroke-dasharray:8 7; marker-end:url(#arrow); }
      .label { font:600 11px Inter, ui-sans-serif, system-ui, sans-serif; fill:#475569; }
      .headline { font:800 34px Inter, ui-sans-serif, system-ui, sans-serif; fill:#0f172a; }
      .subtitle { font:500 15px Inter, ui-sans-serif, system-ui, sans-serif; fill:#475569; }
      .badge { font:700 11px Inter, ui-sans-serif, system-ui, sans-serif; fill:#334155; letter-spacing:.08em; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="980"/>
  <text x="72" y="72" class="headline">FinOps Agent Architecture</text>
  <text x="72" y="104" class="subtitle">Evidence-backed Kubernetes cost intelligence with operator-controlled remediation and verified outcomes</text>

  <rect x="72" y="142" width="330" height="670" class="group"/>
  <text x="100" y="182" class="group-title">Evidence Sources</text>
  <text x="100" y="204" class="group-sub">Operational and financial inputs</text>

  <rect x="108" y="246" width="258" height="112" class="node node-blue"/>
  <circle cx="142" cy="282" r="18" fill="#3b82f6"/>
  <path d="M134 282h16M142 274v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="174" y="278" class="node-title">Kubernetes API</text>
  <text x="174" y="301" class="node-sub">Workloads, nodes, PVCs, requests</text>
  <text x="174" y="320" class="node-sub">Namespaces and ownership context</text>

  <rect x="108" y="392" width="258" height="112" class="node node-blue"/>
  <circle cx="142" cy="428" r="18" fill="#2563eb"/>
  <path d="M131 439l8-13 7 6 8-16" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="174" y="424" class="node-title">Prometheus</text>
  <text x="174" y="447" class="node-sub">24h / 72h utilization evidence</text>
  <text x="174" y="466" class="node-sub">CPU, memory and storage telemetry</text>

  <rect x="108" y="538" width="258" height="112" class="node node-blue"/>
  <circle cx="142" cy="574" r="18" fill="#1d4ed8"/>
  <text x="136" y="581" font-family="Inter, system-ui" font-size="20" font-weight="800" fill="#fff">$</text>
  <text x="174" y="570" class="node-title">Cost Inputs</text>
  <text x="174" y="593" class="node-sub">Cloud rates or owned-hardware TCO</text>
  <text x="174" y="612" class="node-sub">Power, amortization, storage rates</text>

  <rect x="452" y="142" width="620" height="670" class="group-core"/>
  <text x="482" y="182" class="group-title">FinOps Agent Core</text>
  <text x="482" y="204" class="group-sub">Collection, cost modeling, analysis and outcome validation</text>

  <rect x="500" y="244" width="220" height="100" class="node node-amber"/>
  <circle cx="532" cy="277" r="16" fill="#f97316"/>
  <path d="M525 276h14M532 269v14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <text x="560" y="275" class="node-title">Evidence Collector</text>
  <text x="560" y="298" class="node-sub">Normalizes source evidence</text>

  <rect x="798" y="244" width="220" height="100" class="node node-amber"/>
  <circle cx="830" cy="277" r="16" fill="#ea580c"/>
  <text x="823" y="284" font-family="Inter, system-ui" font-size="17" font-weight="800" fill="#fff">Σ</text>
  <text x="858" y="275" class="node-title">Cost Model</text>
  <text x="858" y="298" class="node-sub">Allocation and TCO logic</text>

  <rect x="648" y="395" width="240" height="112" class="node node-amber"/>
  <circle cx="680" cy="431" r="16" fill="#f59e0b"/>
  <path d="M672 440l6-11 7 6 8-15" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="710" y="427" class="node-title">Efficiency Analysis</text>
  <text x="710" y="450" class="node-sub">Waste, rightsizing and anomalies</text>
  <text x="710" y="469" class="node-sub">Confidence from observation windows</text>

  <rect x="648" y="556" width="240" height="112" class="node node-amber"/>
  <circle cx="680" cy="592" r="16" fill="#d97706"/>
  <path d="M674 593l5 5 9-12" fill="none" stroke="#fff" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="710" y="588" class="node-title">Recommendations</text>
  <text x="710" y="611" class="node-sub">KEEP, INVESTIGATE, RIGHTSIZE</text>
  <text x="710" y="630" class="node-sub">Evidence and expected opportunity</text>

  <rect x="648" y="706" width="240" height="76" class="node node-amber"/>
  <text x="676" y="739" class="node-title">Savings Validation</text>
  <text x="676" y="760" class="node-sub">Modeled vs realized outcomes</text>

  <rect x="1120" y="142" width="408" height="312" class="group"/>
  <text x="1148" y="182" class="group-title">Delivery &amp; Integrations</text>
  <text x="1148" y="204" class="group-sub">Organization-facing interfaces</text>

  <rect x="1156" y="240" width="156" height="82" class="node node-green"/>
  <text x="1180" y="273" class="node-title">REST API / CLI</text>
  <text x="1180" y="295" class="node-sub">Direct access</text>

  <rect x="1336" y="240" width="156" height="82" class="node node-green"/>
  <text x="1361" y="273" class="node-title">Automation</text>
  <text x="1361" y="295" class="node-sub">n8n / workflows</text>

  <rect x="1246" y="348" width="156" height="82" class="node node-green"/>
  <text x="1270" y="381" class="node-title">Delivery</text>
  <text x="1270" y="403" class="node-sub">Webhook / chat / reports</text>

  <rect x="1120" y="500" width="408" height="312" class="group"/>
  <text x="1148" y="540" class="group-title">Operator Control</text>
  <text x="1148" y="562" class="group-sub">Human-approved remediation loop</text>

  <rect x="1156" y="602" width="156" height="82" class="node node-purple"/>
  <text x="1178" y="635" class="node-title">Review &amp; Approval</text>
  <text x="1178" y="657" class="node-sub">Operator decision</text>

  <rect x="1336" y="602" width="156" height="82" class="node node-purple"/>
  <text x="1362" y="635" class="node-title">Change</text>
  <text x="1362" y="657" class="node-sub">Infrastructure action</text>

  <rect x="1246" y="710" width="156" height="82" class="node node-purple"/>
  <text x="1265" y="743" class="node-title">Measure Again</text>
  <text x="1265" y="765" class="node-sub">Post-change evidence</text>

  <path d="M366 300 C420 300, 450 290, 500 290" class="edge"/>
  <text x="393" y="281" class="label">inventory</text>

  <path d="M366 448 C432 448, 463 324, 500 310" class="edge"/>
  <text x="396" y="409" class="label">telemetry</text>

  <path d="M366 594 C520 594, 650 294, 798 294" class="edge"/>
  <text x="470" y="561" class="label">pricing / TCO</text>

  <path d="M720 294 L798 294" class="edge"/>
  <path d="M610 344 C610 378, 656 392, 680 395" class="edge"/>
  <path d="M908 344 C908 378, 854 392, 828 395" class="edge"/>
  <path d="M768 507 L768 556" class="edge"/>

  <path d="M888 612 C986 612, 1060 281, 1156 281" class="edge"/>
  <path d="M888 612 C1020 612, 1170 281, 1336 281" class="edge"/>
  <path d="M1312 322 C1312 337, 1310 347, 1310 348" class="edge"/>
  <path d="M1414 322 C1414 346, 1378 374, 1402 389" class="edge"/>

  <path d="M888 612 C1004 612, 1075 642, 1156 642" class="edge"/>
  <text x="972" y="598" class="label">recommendation</text>

  <path d="M1312 642 L1336 642" class="edge"/>
  <text x="1313" y="624" class="label">approved</text>

  <path d="M1414 684 C1414 715, 1385 750, 1402 750" class="edge"/>
  <path d="M1246 750 C1090 750, 1005 744, 888 744" class="edge"/>
  <text x="1002" y="727" class="label">post-change evidence</text>

  <path d="M768 706 C768 684, 768 680, 768 668" class="edge-dash"/>
  <text x="785" y="693" class="label">verified outcome</text>

  <rect x="72" y="858" width="1456" height="72" rx="18" fill="#ffffff" stroke="#dbe3ed"/>
  <text x="96" y="889" class="badge">FINANCIAL INTEGRITY</text>
  <text x="260" y="889" class="node-sub">Modeled infrastructure cost</text>
  <text x="440" y="889" class="node-title">≠</text>
  <text x="474" y="889" class="node-sub">Optimization opportunity</text>
  <text x="662" y="889" class="node-title">≠</text>
  <text x="696" y="889" class="node-sub">Realized savings</text>
  <text x="96" y="913" class="group-sub">Recommendations remain operator-controlled; realized savings require auditable before-and-after evidence.</text>
</svg>